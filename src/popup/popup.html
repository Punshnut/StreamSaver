<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamSaver</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup">
      <!-- Background grid -->
      <div class="bg-grid" aria-hidden="true"></div>

      <!-- Header -->
      <header class="hero">
        <div class="hero-head">
          <div class="hero-copy">
            <p class="eyebrow">LIVE CONTROL DECK</p>
            <h1 class="title">StreamSaver</h1>
            <p class="subtitle">Fast and reliable Twitch quality controls</p>
          </div>
        </div>
      </header>

      <!-- Mode controls -->
      <section class="panel" aria-label="Mode">
        <h2>Mode</h2>
        <div class="mode-toggle" role="group" aria-label="StreamSaver mode">
          <button type="button" id="mode-low-btn" class="mode-btn" data-mode="low">Data Saver</button>
          <button type="button" id="mode-medium-btn" class="mode-btn fade-toggle" data-mode="medium" data-open="false" hidden>Balanced</button>
          <button type="button" id="mode-high-btn" class="mode-btn" data-mode="high">High Quality</button>
        </div>
        <div class="master-switch-row">
          <p class="master-switch-copy">Plugin logic</p>
          <label class="inline-toggle inline-toggle--master" for="plugin-enabled">
            <input type="checkbox" id="plugin-enabled" name="pluginEnabled" />
            <span id="plugin-enabled-label">Enabled</span>
          </label>
        </div>
      </section>

      <!-- Quick resolution controls -->
      <section class="panel" aria-label="Quick Resolution">
        <div class="panel-head">
          <h2>Quick Resolution</h2>
          <label class="inline-toggle" for="quick-resolution-visible">
            <input
              type="checkbox"
              id="quick-resolution-visible"
              name="quickResolutionVisible"
              aria-controls="quick-resolution-content"
            />
            <span>Show</span>
          </label>
        </div>
        <div id="quick-resolution-content" class="quick-resolution-content collapsible" data-open="false" hidden>
          <div class="quality-grid">
            <button type="button" class="quality-btn" data-quality="160p">160p</button>
            <button type="button" class="quality-btn" data-quality="360p">360p</button>
            <button type="button" class="quality-btn" data-quality="480p">480p</button>
            <button type="button" class="quality-btn" data-quality="720p">720p</button>
            <button type="button" class="quality-btn" data-quality="1080p">1080p</button>
            <button type="button" class="quality-btn" data-quality="1440p">1440p</button>
            <button type="button" class="quality-btn" data-quality="2160p">2160p</button>
            <button type="button" class="quality-btn quality-btn--auto" data-quality="Auto">Auto</button>
            <button type="button" class="quality-btn" data-quality="Source">Source</button>
          </div>
        </div>
      </section>

      <!-- Mode resolution presets -->
      <section class="panel" aria-label="Resolutions">
        <div class="panel-head">
          <h2>Resolutions</h2>
          <label class="inline-toggle" for="triple-mode-enabled">
            <input
              type="checkbox"
              id="triple-mode-enabled"
              name="tripleModeEnabled"
              aria-controls="fastToggleMediumWrap mode-medium-btn"
            />
            <span>Triple Mode</span>
          </label>
        </div>
        <div class="row">
          <label for="fastToggleLow">Data Saver</label>
          <select id="fastToggleLow" name="fastToggleLow">
            <option value="Auto">Auto</option>
            <option value="160p">160p</option>
            <option value="360p">360p</option>
            <option value="480p" selected>480p</option>
            <option value="720p">720p</option>
            <option value="1080p">1080p</option>
            <option value="1440p">1440p</option>
            <option value="2160p">2160p</option>
            <option value="Source">Source</option>
          </select>
        </div>
        <div class="collapsible" id="fastToggleMediumWrap" data-open="false" hidden>
          <div class="row" id="fastToggleMediumRow">
            <label for="fastToggleMedium">Balanced</label>
            <select id="fastToggleMedium" name="fastToggleMedium">
              <option value="Auto">Auto</option>
              <option value="160p">160p</option>
              <option value="360p">360p</option>
              <option value="480p">480p</option>
              <option value="720p" selected>720p</option>
              <option value="1080p">1080p</option>
              <option value="1440p">1440p</option>
              <option value="2160p">2160p</option>
              <option value="Source">Source</option>
            </select>
          </div>
        </div>
        <div class="row">
          <label for="fastToggleHigh">High Quality</label>
          <select id="fastToggleHigh" name="fastToggleHigh">
            <option value="Auto">Auto</option>
            <option value="160p">160p</option>
            <option value="360p">360p</option>
            <option value="480p">480p</option>
            <option value="720p">720p</option>
            <option value="1080p">1080p</option>
            <option value="1440p">1440p</option>
            <option value="2160p">2160p</option>
            <option value="Source" selected>Source</option>
          </select>
        </div>
        <div class="master-switch-row">
          <p class="master-switch-copy">Aggressive Mode</p>
          <label
            class="inline-toggle inline-toggle--master"
            for="aggressive-mode-enabled"
            title="Also periodically re-checks and corrects quality drift in background/unfocused tabs, not just on focus or navigation."
          >
            <input type="checkbox" id="aggressive-mode-enabled" name="aggressiveMode" />
            <span id="aggressive-mode-label">Off</span>
          </label>
        </div>
      </section>

      <!-- Project links -->
      <div class="support-row">
        <a
          class="support-link-btn support-link-btn--website"
          href="https://feuerbacher.me/streamsaver-browser-extension/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open StreamSaver website"
          >Website</a>
        <a
          class="support-link-btn support-link-btn--github"
          href="https://github.com/Punshnut/StreamSaver"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open StreamSaver GitHub project"
          ><span class="btn-label--default">Update</span
          ><span class="btn-label--hover">GitHub</span></a>
        <a
          class="support-link-btn support-link-btn--donate"
          href="https://ko-fi.com/janfeuerbacher"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Donate to support StreamSaver"
          >Donate</a>
      </div>

      <!-- Status line -->
      <div id="status" class="status" data-state="loading">Loading popup...</div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
